# Panel de Rumbo Mercante (Sveltia CMS)
# Se entra solo con una clave de GitHub limitada a este repositorio.
backend:
  name: github
  repo: rumbomercante/rumbomercante
  branch: main
  # La entrada con usuario y contraseña la hace /admin/acceso.js (con /api/auth en Vercel).
  # Si alguna vez apareciera la pantalla propia de Sveltia, solo ofrece entrar con token.
  auth_methods: [token]
  commit_messages:
    create: "Crear {{collection}} «{{slug}}» (desde el panel)"
    update: "Editar {{collection}} «{{slug}}» (desde el panel)"
    delete: "Borrar {{collection}} «{{slug}}» (desde el panel)"
    uploadMedia: "Subir imagen «{{path}}» (desde el panel)"
    deleteMedia: "Borrar imagen «{{path}}» (desde el panel)"

site_url: https://rumbomercante.vercel.app
display_url: https://rumbomercante.vercel.app
locale: es
app_title: Panel de Rumbo Mercante
logo:
  src: /favicon.svg
  show_in_header: true
media_folder: /public/img
# Al subir una imagen, el panel la convierte a WebP y la reduce (como los plugins de WordPress).
media_libraries:
  default:
    config:
      transformations:
        raster_image: { format: webp, quality: 82, width: 1600, height: 1600 }
        svg: { optimize: true }
public_folder: /img

collections:
  # ---------------- Artículos ----------------
  - name: articulos
    label: Entradas del blog
    label_singular: entrada
    icon: article
    description: Crea, edita o despublica los artículos. Cada guardado se publica en la web en 1-2 minutos.
    folder: src/content/articulos
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: titulo
    summary: "{{titulo}}"
    sortable_fields: [fecha, titulo]
    preview_path: "/{{fields.categoria}}/{{slug}}/"
    view_groups:
      - { label: Sección, field: categoria }
    media_folder: /public/img/articulos
    public_folder: /img/articulos
    fields:
      - { name: titulo, label: Título, widget: string, maxlength: 110, hint: "Para Google lo ideal son 60-65 caracteres. Si es más largo, escribe una versión corta en «SEO de este artículo»." }
      - { name: descripcion, label: Resumen, widget: text, maxlength: 230, hint: "Aparece debajo del título y en las tarjetas. Google muestra unos 160 caracteres: si es más largo, escribe una versión corta en «SEO de este artículo»." }
      - { name: fecha, label: Fecha de publicación, widget: datetime, type: date, input_timezone: utc, hint: "Si eliges una fecha futura, el artículo queda programado y se publica solo ese día, poco después de la medianoche (hora de Venezuela)." }
      - { name: publicado, label: Publicado, widget: boolean, default: true, hint: "Desactívalo para guardar como borrador sin mostrarlo en la web." }
      - name: categoria
        label: Sección
        widget: select
        hint: "Forma parte de la dirección de la página. Si la cambias en un artículo ya publicado, agrega una redirección."
        options:
          - { value: recursos/plantillas, label: "Recursos › Plantillas" }
          - { value: recursos/checklists, label: "Recursos › Checklists" }
          - { value: recursos/ingles-maritimo, label: "Recursos › Inglés marítimo" }
          - { value: guias/sala-de-maquinas, label: "Guías › Sala de máquinas" }
          - { value: guias/cubierta, label: "Guías › Cubierta y navegación" }
          - { value: guias/seguridad, label: "Guías › Seguridad" }
          - { value: guias/formacion, label: "Guías › Formación y estudios" }
          - { value: vida-a-bordo/primer-embarque, label: "Vida a Bordo › Primer embarque" }
          - { value: vida-a-bordo/bienestar, label: "Vida a Bordo › Bienestar y fatiga" }
          - { value: vida-a-bordo/carrera-profesional, label: "Vida a Bordo › Carrera profesional" }
          - { value: actualidad/normativa, label: "Actualidad › Normativa" }
          - { value: actualidad/industria, label: "Actualidad › Industria" }
          - { value: actualidad/novedades, label: "Actualidad › Novedades del sitio" }
      - { name: tipo, label: Tipo de contenido, widget: select, hint: "Es la etiqueta que aparece sobre la imagen.", options: [Guía, Artículo, Checklist, Glosario, Plantilla, Noticia] }
      - { name: imagen, label: Imagen principal, widget: image }
      - { name: imagenAlt, label: Descripción de la imagen, widget: string, required: false, maxlength: 125, hint: "Muy recomendable: describe la imagen para Google y para personas que no pueden verla." }
      - { name: minutos, label: Minutos de lectura, widget: number, value_type: int, required: false, hint: "Déjalo vacío para calcularlo automáticamente." }
      - { name: etiquetas, label: Etiquetas, widget: list, required: false }
      - { name: imprimible, label: Mostrar botón de imprimir, widget: boolean, default: false, required: false }
      - { name: descargaUrl, label: Archivo descargable (dirección), widget: string, required: false, hint: "Por ejemplo /descargas/archivo.csv. Déjalo vacío si no hay descarga." }
      - { name: descargaTexto, label: Texto del botón de descarga, widget: string, required: false }
      - name: seo
        label: SEO de este artículo
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: titulo, label: Título para Google, widget: string, required: false, maxlength: 65, hint: "Ideal: entre 50 y 60 caracteres. Vacío usa el título del artículo." }
          - { name: descripcion, label: Descripción para Google, widget: text, required: false, maxlength: 165, hint: "Ideal: entre 120 y 160 caracteres. Vacío usa el resumen." }
          - { name: imagen, label: Imagen para redes sociales, widget: image, required: false, hint: "Tamaño ideal 1200 × 630. Vacía usa la imagen principal.", media_folder: /public/og/articulos, public_folder: /og/articulos }
          - { name: palabraClave, label: Palabra clave objetivo, widget: string, required: false, hint: "Nota interna para orientar el artículo; no se publica." }
          - { name: noindex, label: Ocultar de Google, widget: boolean, default: false, required: false }
      - name: body
        label: Contenido
        widget: markdown
        hint: "Con el botón de bloques puedes añadir recuadros de aviso, botones, vídeos de YouTube, listas con casillas y tablas."
        editor_components: [image, aviso, boton, youtube, checklist, table, hr]

  - divider: true

  # ---------------- Portada y anunciantes ----------------
  - name: ajustes
    label: Portada y anunciantes
    icon: storefront
    description: Qué se muestra en la portada, las tarjetas de anunciantes y la página Anúnciate.
    editor: { preview: false }
    files:
      - name: anunciantes
        label: Anunciantes
        file: src/data/anunciantes.json
        format: json
        fields:
          - name: anunciantes
            label: Tarjetas de la portada
            widget: list
            collapsed: true
            summary: "{{nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: etiqueta, label: Categoría (línea superior), widget: string, required: false }
              - { name: frase, label: Frase, widget: text, required: false }
              - { name: logo, label: Logo, widget: image, required: false, media_folder: /public/img/anunciantes, public_folder: /img/anunciantes }
              - { name: alt, label: Descripción del logo, widget: string, required: false }
              - { name: formato, label: Forma del logo, widget: select, required: false, options: [{ value: wide, label: Ancho }, { value: square, label: Cuadrado }] }
              - { name: url, label: Enlace, widget: string }
              - { name: hueco, label: Tarjeta de "Coloca tu marca aquí", widget: boolean, default: false, required: false, hint: "Actívalo para mostrar un espacio libre en vez de un anunciante." }

      - name: anunciate
        label: Página Anúnciate
        file: src/data/anunciate.json
        format: json
        fields:
          - { name: titulo, label: Título, widget: string }
          - { name: introduccion, label: Introducción, widget: text, required: false }
          - { name: textoGratis, label: Texto de la pastilla superior, widget: string, required: false }
          - name: modalidades
            label: Modalidades (¿a quién va dirigido?)
            widget: list
            collapsed: true
            required: false
            summary: "{{titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text, required: false }
          - name: planes
            label: Planes (opcional)
            hint: "Si agregas planes, aparece una sección nueva en la página."
            widget: list
            collapsed: true
            required: false
            summary: "{{nombre}}"
            fields:
              - { name: nombre, label: Nombre del plan, widget: string }
              - { name: precio, label: Precio, widget: string, required: false }
              - { name: descripcion, label: Qué incluye, widget: text, required: false }
          - name: pasos
            label: Cómo funciona
            widget: list
            collapsed: true
            required: false
            summary: "{{titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text, required: false }
          - { name: nota, label: Nota final, widget: text, required: false }
          - { name: ctaTitulo, label: Título de la franja final, widget: string, required: false }
          - { name: ctaBoton, label: Texto del botón final, widget: string, required: false }
          - { name: promoVisible, label: Mostrar aviso en la portada, widget: boolean, default: true, required: false }
          - { name: promoTitulo, label: Título del aviso en la portada, widget: string, required: false }
          - { name: promoTexto, label: Texto del aviso en la portada, widget: text, required: false }

      - name: portada
        label: Portada
        file: src/data/portada.json
        format: json
        fields:
          - { name: destacados, label: Artículos destacados, widget: relation, collection: articulos, value_field: "{{slug}}", search_fields: [titulo], display_fields: [titulo], multiple: true, max: 3, required: false }
          - { name: fotoPortada, label: Foto de portada, widget: image, required: false, hint: "Déjala vacía para usar la foto actual." }
          - { name: mostrarSecciones, label: "Mostrar «Cuatro secciones»", widget: boolean, default: true, required: false }
          - { name: mostrarDestacados, label: Mostrar Destacados, widget: boolean, default: true, required: false }
          - { name: mostrarUltimas, label: Mostrar Últimas publicaciones, widget: boolean, default: true, required: false }
          - { name: mostrarHerramientas, label: Mostrar Herramientas, widget: boolean, default: true, required: false }
          - { name: mostrarAnunciantes, label: Mostrar Anunciantes, widget: boolean, default: true, required: false }
          - name: textos
            label: Textos de la portada
            hint: "«Resaltado» es la parte final del título que aparece en cursiva y en otro color."
            widget: object
            collapsed: true
            fields:
              - name: hero
                label: Cabecera (lo primero que se ve)
                widget: object
                collapsed: true
                fields:
                  - { name: etiqueta, label: Línea superior, widget: string }
                  - { name: titulo, label: Título, widget: text }
                  - { name: resaltado, label: Título · resaltado, widget: string }
                  - { name: texto, label: Texto, widget: text }
                  - { name: boton1, label: Botón principal, widget: string }
                  - { name: boton2, label: Botón secundario, widget: string }
              - name: secciones
                label: Cuatro secciones
                widget: object
                collapsed: true
                fields:
                  - { name: etiqueta, label: Línea superior, widget: string }
                  - { name: titulo, label: Título, widget: string }
                  - { name: resaltado, label: Título · resaltado, widget: string }
                  - { name: recursos, label: Texto de Recursos, widget: text }
                  - { name: guias, label: Texto de Guías y Operaciones, widget: text }
                  - { name: vidaABordo, label: Texto de Vida a Bordo, widget: text }
                  - { name: actualidad, label: Texto de Actualidad Marítima, widget: text }
              - name: destacados
                label: Destacados
                widget: object
                collapsed: true
                fields:
                  - { name: etiqueta, label: Línea superior, widget: string }
                  - { name: titulo, label: Título, widget: string }
                  - { name: resaltado, label: Título · resaltado, widget: string }
                  - { name: texto, label: Texto, widget: text }
                  - { name: boton, label: Botón, widget: string }
              - name: ultimas
                label: Últimas publicaciones
                widget: object
                collapsed: true
                fields:
                  - { name: etiqueta, label: Línea superior, widget: string }
                  - { name: titulo, label: Título, widget: string }
                  - { name: boton, label: Botón, widget: string }
              - name: herramientas
                label: Herramientas
                widget: object
                collapsed: true
                fields:
                  - { name: etiqueta, label: Línea superior, widget: string }
                  - { name: titulo, label: Título, widget: string }
                  - { name: resaltado, label: Título · resaltado, widget: string }
                  - { name: calcTitulo, label: Calculadora · título, widget: string }
                  - { name: calcTexto, label: Calculadora · texto, widget: text }
                  - { name: convTitulo, label: Conversor · título, widget: string }
                  - { name: convTexto, label: Conversor · texto, widget: text }
              - name: anunciantes
                label: Anunciantes
                widget: object
                collapsed: true
                fields:
                  - { name: etiqueta, label: Línea superior, widget: string }
                  - { name: titulo, label: Título, widget: string }
                  - { name: texto, label: Texto, widget: text }
                  - { name: boton, label: Botón, widget: string }
                  - { name: frase, label: Frase junto al botón, widget: string }

  - divider: true

  # ---------------- Páginas, menú y pie ----------------
  - name: paginas-editables
    label: Páginas, menú y pie
    icon: web
    description: Nosotros, las páginas legales, el menú superior y el pie de página con tus redes sociales.
    files:
      - name: nosotros
        label: Nosotros
        file: src/content/paginas/nosotros.md
        format: frontmatter
        editor: { preview: false }
        fields:
          - { name: titulo, label: Título de la página, widget: string }
          - { name: foto, label: Foto, widget: image, required: false, media_folder: /public/img, public_folder: /img, hint: "Mejor cuadrada (por ejemplo 800 × 800). Vacía usa la foto actual." }
          - { name: nombre, label: Nombre, widget: string, hint: "También aparece como autor en los artículos." }
          - { name: cargo, label: Cargo, widget: string, hint: "También aparece en la tarjeta de autor de los artículos." }
          - { name: datos, label: Datos bajo la foto, widget: list }
          - { name: resumenAutor, label: Resumen para la tarjeta de autor, widget: text, maxlength: 140, hint: "Una o dos frases que aparecen en la tarjeta de autor de cada artículo." }
          - { name: body, label: Tu historia, widget: markdown, editor_components: [image] }
          - { name: cierre, label: Frase de cierre, widget: string }
          - { name: firma, label: Firma, widget: string }
          - { name: valoresTitulo, label: Título de los recuadros, widget: string }
          - name: valores
            label: Recuadros «Lo que encontrarás aquí»
            widget: list
            summary: "{{titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text }
          - { name: ctaTitulo, label: Pregunta final, widget: string }
          - { name: ctaBoton, label: Texto del botón final, widget: string }
      - name: privacidad
        label: Política de privacidad
        file: src/content/paginas/politica-de-privacidad.md
        format: frontmatter
        editor: { preview: false }
        fields:
          - { name: titulo, label: Título, widget: string }
          - { name: etiqueta, label: Línea superior, widget: string }
          - { name: actualizado, label: Última actualización, widget: datetime, type: date, input_timezone: utc, hint: "Cámbiala cada vez que modifiques el texto." }
          - { name: body, label: Texto, widget: markdown, editor_components: [] }
      - name: terminos
        label: Términos de uso
        file: src/content/paginas/terminos.md
        format: frontmatter
        editor: { preview: false }
        fields:
          - { name: titulo, label: Título, widget: string }
          - { name: etiqueta, label: Línea superior, widget: string }
          - { name: actualizado, label: Última actualización, widget: datetime, type: date, input_timezone: utc, hint: "Cámbiala cada vez que modifiques el texto." }
          - { name: body, label: Texto, widget: markdown, editor_components: [] }
      - name: menu
        label: Menú superior
        file: src/data/menu.json
        format: json
        editor: { preview: false }
        fields:
          - name: enlaces
            label: Enlaces del menú
            widget: list
            summary: "{{texto}} → {{url}}"
            hint: "Arrastra para cambiar el orden. Mejor no más de 5 para que quepa en el móvil."
            fields:
              - { name: texto, label: Texto, widget: string }
              - { name: url, label: Dirección, widget: string, hint: "Por ejemplo /blog/ o /recursos/" }
          - name: boton
            label: Botón destacado (a la derecha)
            widget: object
            fields:
              - { name: texto, label: Texto, widget: string, required: false, hint: "Déjalo vacío para no mostrar botón." }
              - { name: url, label: Dirección, widget: string, required: false }
      - name: pie
        label: Pie de página y redes sociales
        file: src/data/pie.json
        format: json
        editor: { preview: false }
        fields:
          - { name: lema, label: Frase bajo el logo, widget: text }
          - { name: firma, label: Frase en cursiva, widget: string }
          - name: redes
            label: Redes sociales
            widget: list
            required: false
            summary: "{{red}}"
            hint: "Aparecen como iconos bajo el logo, en todas las páginas."
            fields:
              - name: red
                label: Red
                widget: select
                options:
                  - { value: instagram, label: Instagram }
                  - { value: facebook, label: Facebook }
                  - { value: whatsapp, label: WhatsApp }
                  - { value: youtube, label: YouTube }
                  - { value: tiktok, label: TikTok }
                  - { value: linkedin, label: LinkedIn }
                  - { value: x, label: X (Twitter) }
                  - { value: telegram, label: Telegram }
                  - { value: correo, label: Correo electrónico }
              - { name: url, label: Enlace, widget: string, hint: "Por ejemplo https://instagram.com/rumbomercante · para WhatsApp: https://wa.me/58412... · para correo: mailto:tu@correo.com" }
          - name: columnas
            label: Columnas de enlaces
            widget: list
            summary: "{{titulo}}"
            fields:
              - { name: titulo, label: Título de la columna, widget: string }
              - name: enlaces
                label: Enlaces
                widget: list
                summary: "{{texto}}"
                fields:
                  - { name: texto, label: Texto, widget: string }
                  - { name: url, label: Dirección, widget: string }
                  - { name: externo, label: Es de otra web (abre en otra pestaña), widget: boolean, default: false, required: false }
          - { name: copyright, label: Texto de derechos, widget: string }
          - { name: coordenadas, label: Coordenadas (abajo a la derecha), widget: string }

  # ---------------- Apariencia y SEO ----------------
  - name: apariencia-seo
    label: Apariencia y SEO
    icon: palette
    description: Colores de la web, datos generales, textos para Google y redirecciones de direcciones antiguas.
    editor: { preview: false }
    files:
      - name: apariencia
        label: Apariencia
        file: src/data/apariencia.json
        format: json
        fields:
          - name: acento
            label: Color de acento
            widget: select
            options:
              - { value: dorado, label: Dorado (actual) }
              - { value: cobre, label: Cobre }
              - { value: turquesa, label: Turquesa }
              - { value: plata, label: Plata }
          - name: translucidez
            label: Translucidez de las tarjetas azules
            widget: select
            options:
              - { value: actual, label: Actual }
              - { value: mas, label: Más translúcidas }
              - { value: menos, label: Más sólidas }

      - name: seo
        label: SEO general
        file: src/data/seo.json
        format: json
        fields:
          - { name: url, label: Dirección del sitio, widget: string, hint: "Cámbiala cuando tengas el dominio. Sin barra al final." }
          - { name: nombre, label: Nombre del sitio, widget: string }
          - { name: correoContacto, label: Correo de contacto, widget: string }
          - { name: verificacionGoogle, label: Código de Google Search Console, widget: string, required: false }
          - { name: verificacionBing, label: Código de Bing, widget: string, required: false }

      - name: paginas
        label: SEO de cada página
        file: src/data/paginas.json
        format: json
        fields:
          - name: paginas
            label: Páginas
            widget: list
            collapsed: true
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{ruta}}"
            fields:
              - { name: ruta, label: Página, widget: string, readonly: true }
              - { name: titulo, label: Título para Google, widget: string, required: false, maxlength: 65, hint: "Ideal: entre 50 y 60 caracteres." }
              - { name: descripcion, label: Descripción para Google, widget: text, required: false, maxlength: 165, hint: "Ideal: entre 120 y 160 caracteres." }
              - { name: noindex, label: Ocultar de Google, widget: boolean, default: false, required: false }

      - name: redirecciones
        label: Redirecciones
        file: vercel.json
        format: json
        fields:
          - name: redirects
            label: Direcciones que se envían a otra
            widget: list
            collapsed: true
            summary: "{{source}} → {{destination}}"
            fields:
              - { name: source, label: Dirección antigua, widget: string }
              - { name: destination, label: Dirección nueva, widget: string }
              - { name: permanent, label: Permanente, widget: boolean, default: true }
