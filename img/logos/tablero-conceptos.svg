      <text font-size="13" fill="#cbd5e1" font-weight="600">✓ Gran carácter industrial y naviero</text>
      <text y="24" font-size="13" fill="#cbd5e1" font-weight="600">✓ Muy moderno y diferenciador en el sector</text>
      <text y="48" font-size="13" fill="#cbd5e1" font-weight="600">✓ Representa directamente a los buques mercantes</text>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- COLUMNA 3: CONCEPTO 3 - MONOGRAMA RM      -->
  <!-- ========================================== -->
  <g transform="translate(1080, 200)">
    <rect width="440" height="820" rx="20" fill="#111d2e" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="32" y="44" class="card-type">03 · Monograma Tipográfico</text>
    <text x="32" y="78" class="card-title">Monograma RM</text>
    <text x="32" y="106" class="card-desc">Arquitectura náutica continua.</text>
    <text x="32" y="126" class="card-desc">Mástil, compás y vector a 45°.</text>

