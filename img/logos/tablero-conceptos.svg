      <rect width="376" height="150" rx="14" fill="#061a2d" stroke="#1e293b"/>
      <g transform="translate(25, 10) scale(0.25)">
        <polygon points="256,44 116,214 256,214" fill="#ffffff"/>
        <polygon points="256,44 256,214 396,214" fill="#f0c27a"/>
        <polygon points="126,234 256,234 256,334 164,334" fill="#ffffff" opacity="0.8"/>
        <polygon points="256,234 386,234 348,334 256,334" fill="#f0c27a" opacity="0.8"/>
        <polygon points="174,354 256,354 256,468 226,444" fill="#ffffff" opacity="0.6"/>
        <polygon points="256,354 338,354 286,444 256,468" fill="#f0c27a" opacity="0.6"/>
      </g>
