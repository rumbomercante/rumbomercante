      <g transform="translate(25, 10) scale(0.25)">
        <circle cx="256" cy="256" r="198" fill="none" stroke="#f0c27a" stroke-width="6"/>
        <path d="M 148 376 L 148 136" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
        <path d="M 148 136 H 220 C 264 136, 264 246, 220 246 H 148" fill="none" stroke="#ffffff" stroke-width="40"/>
        <path d="M 196 246 L 284 376" stroke="#f0c27a" stroke-width="40" stroke-linecap="round"/>
        <path d="M 284 376 L 332 196 L 380 296 L 428 196 L 428 376" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(130, 60)">
