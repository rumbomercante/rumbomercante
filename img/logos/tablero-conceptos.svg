        <circle cx="256" cy="256" r="198" fill="none" stroke="url(#brass-board)" stroke-width="4"/>
        <polygon points="256,44 264,62 248,62" fill="url(#brass-board)"/>
        <!-- R -->
        <path d="M 148 376 L 148 136" stroke="#061a2d" stroke-width="40" stroke-linecap="round"/>
        <path d="M 148 136 H 220 C 264 136, 264 246, 220 246 H 148" fill="none" stroke="#061a2d" stroke-width="40"/>
        <path d="M 196 246 L 284 376" stroke="url(#brass-board)" stroke-width="40" stroke-linecap="round"/>
        <!-- M -->
        <path d="M 284 376 L 332 196 L 380 296 L 428 196 L 428 376" fill="none" stroke="#061a2d" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="196" cy="246" r="12" fill="url(#brass-board)"/>
      </g>
      <g transform="translate(160, 95)">
        <text class="brand-text">RUMBO</text>
        <text y="30" class="brand-text">MERCANTE</text>
        <text y="52" class="brand-sub">DE CERO A LA MAR</text>
      </g>
    </g>

