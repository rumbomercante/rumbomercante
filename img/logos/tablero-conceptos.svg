    <g transform="translate(32, 570)">
      <rect width="376" height="130" rx="14" fill="#0d1624"/>
      <text x="20" y="32" class="tag" fill="#64748b">PRUEBA 1 TINTA &amp; ESCALA</text>
      <!-- Monocromo Negro -->
      <circle cx="50" cy="80" r="24" fill="#ffffff"/>
      <text x="36" y="88" font-family="'Fraunces', serif" font-weight="900" font-size="22" fill="#000000">RM</text>
      <!-- Monocromo Blanco -->
      <circle cx="120" cy="80" r="24" fill="#061a2d"/>
      <text x="106" y="88" font-family="'Fraunces', serif" font-weight="900" font-size="22" fill="#ffffff">RM</text>
      <!-- 32px Favicon demo -->
      <g transform="translate(200, 64)">
        <rect width="32" height="32" rx="7" fill="#061a2d"/>
        <circle cx="16" cy="16" r="12" fill="none" stroke="#f0c27a" stroke-width="1.5"/>
        <text x="8" y="22" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">RM</text>
        <text x="42" y="21" font-size="12" fill="#94a3b8">32px app</text>
