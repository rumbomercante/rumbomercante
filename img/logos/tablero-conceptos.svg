        <text class="brand-text">RUMBO</text>
        <text y="30" class="brand-text">MERCANTE</text>
        <text y="52" class="brand-sub">DE CERO A LA MAR</text>
      </g>
    </g>

    <!-- Caja 2: Versión en Fondo Azul Marino (#061a2d) -->
    <g transform="translate(32, 400)">
      <rect width="376" height="150" rx="14" fill="#061a2d" stroke="#1e293b"/>
      <g transform="translate(25, 10) scale(0.25)">
        <circle cx="256" cy="256" r="168" fill="none" stroke="#f0c27a" stroke-width="8"/>
        <polygon points="256,42 256,256 216,216" fill="#ffffff" opacity="0.9"/>
        <polygon points="450,256 256,256 296,216" fill="#ffffff" opacity="0.9"/>
        <polygon points="256,430 256,256 296,296" fill="#ffffff" opacity="0.9"/>
        <polygon points="62,256 256,256 216,296" fill="#ffffff" opacity="0.9"/>
        <polygon points="256,42 296,216 256,256" fill="#f0c27a"/>
        <polygon points="450,256 296,296 256,256" fill="#f0c27a"/>
        <polygon points="256,430 216,296 256,256" fill="#f0c27a"/>
        <polygon points="62,256 216,216 256,256" fill="#f0c27a"/>
        <circle cx="256" cy="256" r="30" fill="#061a2d" stroke="#f0c27a" stroke-width="8"/>
        <circle cx="256" cy="256" r="10" fill="#f0c27a"/>
