      <g transform="translate(130, 60)">
        <text class="brand-text-dark" font-size="22">RUMBO MERCANTE</text>
        <text y="24" class="brand-sub-dark">RUMBO FIJO · MAR ABIERTO</text>
      </g>
    </g>

    <!-- Caja 3: Prueba Monocromática & Escala 16px/32px -->
    <g transform="translate(32, 570)">
      <rect width="376" height="130" rx="14" fill="#0d1624"/>
      <text x="20" y="32" class="tag" fill="#64748b">PRUEBA 1 TINTA &amp; ESCALA</text>
      <!-- Monocromo Negro -->
      <circle cx="50" cy="80" r="24" fill="#ffffff"/>
      <path d="M50,62 L50,80 L44,74 Z M68,80 L50,80 L56,74 Z M50,98 L50,80 L56,86 Z M32,80 L50,80 L44,86 Z" fill="#000000"/>
      <path d="M50,62 L56,74 L50,80 Z M68,80 L56,86 L50,80 Z M50,98 L44,86 L50,80 Z M32,80 L44,74 L50,80 Z" fill="#666666"/>
      <!-- Monocromo Blanco -->
      <circle cx="120" cy="80" r="24" fill="#061a2d"/>
      <circle cx="120" cy="80" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M120,66 L123,80 L120,80 Z M134,80 L120,80 L120,83 Z M120,94 L120,80 L117,80 Z M106,80 L120,80 L120,77 Z" fill="#ffffff"/>
      <!-- 32px Favicon demo -->
      <g transform="translate(200, 64)">
        <rect width="32" height="32" rx="7" fill="#061a2d"/>
        <circle cx="16" cy="16" r="11" fill="none" stroke="#f0c27a" stroke-width="1.5"/>
        <polygon points="16,6 18,16 16,16" fill="#ffffff"/>
        <polygon points="16,6 16,16 14,16" fill="#f0c27a"/>
        <text x="42" y="21" font-size="12" fill="#94a3b8">32px app</text>
      </g>
      <!-- 16px Favicon demo -->
      <g transform="translate(290, 72)">
        <rect width="16" height="16" rx="4" fill="#061a2d"/>
        <polygon points="8,2 10,8 8,8" fill="#ffffff"/>
        <polygon points="8,2 8,8 6,8" fill="#f0c27a"/>
        <text x="24" y="13" font-size="11" fill="#94a3b8">16px tab</text>
      </g>
    </g>

    <!-- Dictamen -->
    <g transform="translate(32, 720)">
      <text font-size="13" fill="#cbd5e1" font-weight="600">✓ Máxima fidelidad al favicon actual</text>
      <text y="24" font-size="13" fill="#cbd5e1" font-weight="600">✓ Excelente jerarquía e impacto náutico</text>
      <text y="48" font-size="13" fill="#cbd5e1" font-weight="600">✓ Ideal para bordados, sellos y diplomas</text>
