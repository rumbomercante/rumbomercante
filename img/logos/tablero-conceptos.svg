      <g transform="translate(200, 64)">
        <rect width="32" height="32" rx="7" fill="#061a2d"/>
        <polygon points="16,5 8,16 16,16" fill="#ffffff"/>
        <polygon points="16,5 16,16 24,16" fill="#f0c27a"/>
        <polygon points="9,18 16,18 16,26" fill="#ffffff" opacity="0.8"/>
        <polygon points="16,18 23,18 16,26" fill="#f0c27a" opacity="0.8"/>
        <text x="42" y="21" font-size="12" fill="#94a3b8">32px app</text>
      </g>
      <!-- 16px Favicon demo -->
      <g transform="translate(290, 72)">
        <rect width="16" height="16" rx="4" fill="#061a2d"/>
        <polygon points="8,2 3,9 8,9" fill="#ffffff"/>
        <polygon points="8,2 8,9 13,9" fill="#f0c27a"/>
        <text x="24" y="13" font-size="11" fill="#94a3b8">16px tab</text>
