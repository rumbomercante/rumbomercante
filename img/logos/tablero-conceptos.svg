  <!-- ========================================== -->
  <!-- COLUMNA 2: CONCEPTO 2 - RUMBO & PROA      -->
  <!-- ========================================== -->
  <g transform="translate(580, 200)">
    <rect width="440" height="820" rx="20" fill="#111d2e" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="32" y="44" class="card-type">02 · Isotipo Geométrico</text>
    <text x="32" y="78" class="card-title">Rumbo &amp; Proa</text>
    <text x="32" y="106" class="card-desc">Proa mercante cortando el agua.</text>
    <text x="32" y="126" class="card-desc">Diamante naval y avance a mar abierto.</text>

