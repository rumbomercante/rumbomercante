      <polygon points="50,62 40,74 50,74" fill="#000000"/>
      <polygon points="50,62 50,74 60,74" fill="#666666"/>
      <polygon points="42,76 50,76 50,88" fill="#000000"/>
      <polygon points="50,76 58,76 50,88" fill="#666666"/>
      <!-- Monocromo Blanco -->
