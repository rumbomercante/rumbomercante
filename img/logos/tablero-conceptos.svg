        <polygon points="256,44 116,214 256,214" fill="#061a2d"/>
        <polygon points="256,44 256,214 396,214" fill="url(#brass-board)"/>
        <polygon points="126,234 256,234 256,334 164,334" fill="#061a2d"/>
        <polygon points="256,234 386,234 348,334 256,334" fill="url(#brass-board)"/>
        <polygon points="174,354 256,354 256,468 226,444" fill="#061a2d"/>
        <polygon points="256,354 338,354 286,444 256,468" fill="url(#brass-board)"/>
        <polygon points="256,104 274,188 256,176" fill="#ffffff" opacity="0.95"/>
        <polygon points="256,104 256,176 238,188" fill="#cbd5e1"/>
      </g>
      <g transform="translate(160, 95)">
        <text class="brand-text">RUMBO</text>
        <text y="30" class="brand-text">MERCANTE</text>
        <text y="52" class="brand-sub">DE CERO A LA MAR</text>
