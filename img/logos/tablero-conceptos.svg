<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background:#0b131e; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="brass-board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d6a2"/>
      <stop offset="50%" stop-color="#f0c27a"/>
      <stop offset="100%" stop-color="#c59341"/>
    </linearGradient>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-size: 38px; fill: #ffffff; font-weight: 600; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; fill: #94a3b8; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
      .card-title { font-family: 'Fraunces', Georgia, serif; font-size: 26px; fill: #f8fafc; font-weight: 600; }
      .card-type { font-size: 13px; fill: #f0c27a; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
      .card-desc { font-size: 14px; fill: #94a3b8; line-height: 1.5; }
      .tag { font-size: 11px; fill: #cbd5e1; font-weight: 600; }
      .brand-text { font-family: 'Fraunces', Georgia, serif; font-size: 28px; fill: #061a2d; font-weight: 700; letter-spacing: 1.5px; }
      .brand-sub { font-size: 10px; fill: #d4a359; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
      .brand-text-dark { font-family: 'Fraunces', Georgia, serif; font-size: 28px; fill: #ffffff; font-weight: 700; letter-spacing: 1.5px; }
      .brand-sub-dark { font-size: 10px; fill: #f0c27a; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- CABECERA DEL TABLERO -->
  <g transform="translate(80, 70)">
    <text class="subtitle">RUMBO MERCANTE · REVISIÓN DE IDENTIDAD VISUAL</text>
    <text y="48" class="title">Terna de Conceptos de Logotipo &amp; Isotipo</text>
    <text y="80" font-size="15" fill="#64748b">Fase 6: Checkpoint de Aprobación · Evaluados a escala 16px, monocromo y reversibilidad</text>
  </g>

  <!-- ========================================== -->
  <!-- COLUMNA 1: CONCEPTO 1 - LA ROSA CARDINAL  -->
  <!-- ========================================== -->
  <g transform="translate(80, 200)">
    <!-- Contenedor de Concepto -->
    <rect width="440" height="820" rx="20" fill="#111d2e" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Info Header -->
    <text x="32" y="44" class="card-type">01 · Isotipo Simbólico</text>
    <text x="32" y="78" class="card-title">La Rosa Cardinal</text>
    <text x="32" y="106" class="card-desc">Precisión de navegación astronómica.</text>
    <text x="32" y="126" class="card-desc">Norte dominante como guía de rumbo.</text>

    <!-- Caja 1: Versión en Fondo Claro (White Card) -->
    <g transform="translate(32, 150)">
      <rect width="376" height="230" rx="14" fill="#ffffff"/>
      <!-- Símbolo C1 -->
      <g transform="translate(30, 25) scale(0.35)">
        <circle cx="256" cy="256" r="190" fill="none" stroke="#061a2d" stroke-width="6" opacity="0.2"/>
        <circle cx="256" cy="256" r="168" fill="none" stroke="url(#brass-board)" stroke-width="8"/>
        <!-- Facetas Oscuras -->
        <polygon points="256,42 256,256 216,216" fill="#061a2d"/>
        <polygon points="450,256 256,256 296,216" fill="#061a2d"/>
        <polygon points="256,430 256,256 296,296" fill="#061a2d"/>
        <polygon points="62,256 256,256 216,296" fill="#061a2d"/>
        <!-- Facetas Doradas -->
        <polygon points="256,42 296,216 256,256" fill="url(#brass-board)"/>
        <polygon points="450,256 296,296 256,256" fill="url(#brass-board)"/>
        <polygon points="256,430 216,296 256,256" fill="url(#brass-board)"/>
        <polygon points="62,256 216,216 256,256" fill="url(#brass-board)"/>
        <!-- Núcleo -->
        <circle cx="256" cy="256" r="30" fill="#061a2d" stroke="url(#brass-board)" stroke-width="8"/>
        <circle cx="256" cy="256" r="10" fill="url(#brass-board)"/>
