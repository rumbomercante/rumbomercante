<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title-white">
  <title id="title-white">Rumbo Mercante - Isotipo Monocromático Blanco</title>
  <!-- Anillo exterior y marcas -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-width="8"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <g stroke="#ffffff" stroke-width="3" opacity="0.5">
    <line x1="376" y1="136" x2="390" y2="122"/>
    <line x1="376" y1="376" x2="390" y2="390"/>
    <line x1="136" y1="376" x2="122" y2="390"/>
    <line x1="136" y1="136" x2="122" y2="122"/>
  </g>

  <!-- Facetas Sólidas (Blanco puro) -->
  <g fill="#ffffff">
    <polygon points="256,40 256,256 214,214"/>
    <polygon points="460,256 256,256 298,214"/>
    <polygon points="256,436 256,256 298,298"/>
    <polygon points="52,256 256,256 214,298"/>
  </g>

  <!-- Facetas en Línea (Contorno) -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
    <polygon points="256,40 298,214 256,256"/>
    <polygon points="460,256 298,298 256,256"/>
    <polygon points="256,436 214,298 256,256"/>
    <polygon points="52,256 214,214 256,256"/>
  </g>

  <!-- Núcleo central -->
  <circle cx="256" cy="256" r="32" fill="#061a2d" stroke="#ffffff" stroke-width="8"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>

