<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title-c1 desc-c1">
  <title id="title-c1">Rumbo Mercante - Concepto 1: La Rosa Cardinal</title>
  <desc id="desc-c1">Rosa de los vientos de precisión náutica con rumbo Norte dominante, anillo graduado y perno de latón naval.</desc>
  <defs>
    <!-- Gradiente sutil bronce -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d6a2"/>
      <stop offset="50%" stop-color="#f0c27a"/>
      <stop offset="100%" stop-color="#c59341"/>
    </linearGradient>
    <linearGradient id="brass-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a359"/>
      <stop offset="100%" stop-color="#9b6e28"/>
    </linearGradient>
  </defs>

  <!-- Anillo exterior de derrota náutica -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#061a2d" stroke-width="6" opacity="0.2"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#brass-grad)" stroke-width="8"/>
  
  <!-- Marcas de cuadrante (tick marks) -->
  <g stroke="#061a2d" stroke-width="3" opacity="0.4">
    <!-- 45 grados -->
    <line x1="375" y1="137" x2="389" y2="123"/>
    <line x1="375" y1="375" x2="389" y2="389"/>
    <line x1="137" y1="375" x2="123" y2="389"/>
    <line x1="137" y1="137" x2="123" y2="123"/>
    <!-- Puntos intermedios sutiles -->
    <circle cx="392" cy="256" r="3" fill="#061a2d"/>
    <circle cx="120" cy="256" r="3" fill="#061a2d"/>
    <circle cx="256" cy="392" r="3" fill="#061a2d"/>
  </g>

  <!-- ESTRELLA CARDINAL PRINCIPAL -->
  <!-- Facetas Oscuras (Azul Marino #061a2d) -->
  <g fill="#061a2d">
    <!-- Norte - Faceta Izquierda -->
    <polygon points="256,42 256,256 216,216"/>
    <!-- Este - Faceta Superior -->
    <polygon points="450,256 256,256 296,216"/>
    <!-- Sur - Faceta Derecha -->
    <polygon points="256,430 256,256 296,296"/>
    <!-- Oeste - Faceta Inferior -->
    <polygon points="62,256 256,256 216,296"/>
  </g>

  <!-- Facetas Claras (Bronce / Dorado Naval) -->
  <g fill="url(#brass-grad)">
    <!-- Norte - Faceta Derecha (Iluminada / Rumbo) -->
    <polygon points="256,42 296,216 256,256"/>
    <!-- Este - Faceta Inferior -->
    <polygon points="450,256 296,296 256,256"/>
    <!-- Sur - Faceta Izquierda -->
    <polygon points="256,430 216,296 256,256"/>
    <!-- Oeste - Faceta Superior -->
    <polygon points="62,256 216,216 256,256"/>
  </g>

  <!-- Puntas secundarias angulares (intercardinales discretas) -->
  <g fill="#061a2d" opacity="0.35">
    <polygon points="346,166 256,256 276,216"/>
    <polygon points="346,346 256,256 296,276"/>
    <polygon points="166,346 256,256 236,296"/>
    <polygon points="166,166 256,256 216,236"/>
  </g>

  <!-- Núcleo central / Perno de bitácora -->
  <circle cx="256" cy="256" r="30" fill="#061a2d" stroke="url(#brass-grad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="10" fill="url(#brass-grad)"/>
</svg>

