<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title-c2 desc-c2">
  <title id="title-c2">Rumbo Mercante - Concepto 2: Rumbo & Proa Mercante</title>
  <desc id="desc-c2">Proa de buque mercante cortando el agua en perspectiva frontal, fusionada con un diamante náutico y aguja de rumbo.</desc>
  <defs>
    <linearGradient id="brass-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d6a2"/>
      <stop offset="50%" stop-color="#f0c27a"/>
      <stop offset="100%" stop-color="#c59341"/>
    </linearGradient>
    <linearGradient id="ocean-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2c4a"/>
      <stop offset="100%" stop-color="#061a2d"/>
    </linearGradient>
  </defs>

  <!-- Base / Escudo Náutico Geométrico -->
  <!-- Parte Superior: Proa y Rumbo Norte -->
  <!-- Babor (Izquierda - Azul Marino) -->
  <polygon points="256,44 116,214 256,214" fill="#061a2d"/>
  
  <!-- Estribor (Derecha - Bronce Náutico) -->
  <polygon points="256,44 256,214 396,214" fill="url(#brass-c2)"/>

  <!-- Corte de Separación de Cubierta / Horizonte (Espacio negativo de 16px) -->

  <!-- Parte Media: Amuras y Roda del Casco -->
  <!-- Babor medio -->
  <polygon points="126,234 256,234 256,334 164,334" fill="#061a2d"/>
  
  <!-- Estribor medio -->
  <polygon points="256,234 386,234 348,334 256,334" fill="url(#brass-c2)"/>

  <!-- Parte Inferior: Bulbo de Proa y Quilla (Firmeza en mar abierto) -->
  <!-- Babor inferior -->
  <polygon points="174,354 256,354 256,468 226,444" fill="#061a2d"/>
  
  <!-- Estribor inferior -->
  <polygon points="256,354 338,354 286,444 256,468" fill="url(#brass-c2)"/>

  <!-- Aguja Central de Derrota / Compás incrustado en negativo -->
  <polygon points="256,104 274,188 256,176" fill="#ffffff" opacity="0.95"/>
  <polygon points="256,104 256,176 238,188" fill="#e2e8f0"/>

  <!-- Línea de crujía (centerline) de máxima precisión -->
  <line x1="256" y1="44" x2="256" y2="468" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
</svg>

